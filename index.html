<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
        <header>
            <div>
                <span class="brand">Expense Tracker</span>
                <p>Track your expenses, categorize spending, and review your monthly summary.</p>
            </div>
            <div class="summary-card">
                <div>
                    <span>Total Expense</span>
                    <strong id="totalAmount">$0.00</strong>
                </div>
                <div>
                    <span>Last 30 Days</span>
                    <strong id="last30Days">$0.00</strong>
                </div>
            </div>
        </header>

        <main>
            <section class="form-panel">
                <h2>Add Expense</h2>
                <form id="expenseForm">
                    <label>
                        Description
                        <input type="text" id="description" placeholder="e.g. groceries" required>
                    </label>
                    <label>
                        Amount
                        <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                    </label>
                    <label>
                        Category
                        <select id="category" required>
                            <option value="">Select category</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Housing">Housing</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Health">Health</option>
                            <option value="Other">Other</option>
                        </select>
                    </label>
                    <label>
                        Date
                        <input type="date" id="date" required>
                    </label>
                    <button type="submit">Save Expense</button>
                </form>
            </section>

            <section class="table-panel">
                <div class="panel-header">
                    <h2>Expense History</h2>
                    <button id="refreshBtn" class="secondary">Refresh</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Date</th>
                                <th>Amount</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="expenseTableBody">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
